name: Deploy ChurnShield to EC2

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: churnshield
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        run: |
          docker build -t $ECR_REPOSITORY .
          docker tag $ECR_REPOSITORY:latest 937492565192.dkr.ecr.ap-south-1.amazonaws.com/$ECR_REPOSITORY:latest
          docker push 937492565192.dkr.ecr.ap-south-1.amazonaws.com/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin 937492565192.dkr.ecr.ap-south-1.amazonaws.com
            sudo docker pull 937492565192.dkr.ecr.ap-south-1.amazonaws.com/churnshield:latest
            sudo docker stop churnshield-app || true
            sudo docker rm churnshield-app || true
            sudo docker run -d -p 5000:5000 --name churnshield-app 937492565192.dkr.ecr.ap-south-1.amazonaws.com/churnshield:latest